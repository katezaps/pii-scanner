[project]
name = "pii-scanner"
version = "0.1.0"
description = "Open-source data broker auditor"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary,pool]>=3.1.0",
    "psycopg2-binary>=2.9.0",  # required by yoyo-migrations
    "yoyo-migrations>=8.2.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "openai-agents>=0.0.7",
    "click>=8.1.0",
    "rich>=13.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
pii-scanner = "src.cli.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.services.audit.prompts" = ["audit_agent.md"]

[tool.setuptools.data-files]
"share/pii-scanner" = ["brokers/brokers.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pii-scanner.cli]
env_file = ".env.cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
