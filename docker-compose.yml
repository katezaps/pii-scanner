services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pii_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-pii_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pii_scanner}
    ports:
      # Bind to localhost only — never expose Postgres to the network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pii_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres

volumes:
  postgres_data:
